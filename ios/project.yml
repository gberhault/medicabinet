name: MediCabinet
options:
  bundleIdPrefix: com.medicabinet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  MediCabinetCore:
    path: Packages/MediCabinetCore
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.11.1
targets:
  MediCabinet:
    type: application
    platform: iOS
    sources:
      - path: MediCabinet/Sources
      - path: MediCabinet/Resources
      # The BDPM reference database, bundled once for both apps from the repository's reference-data/bundle.
      - path: ../reference-data/bundle/reference.sqlite
        buildPhase: resources
    dependencies:
      - package: MediCabinetCore
      - package: GRDB
    info:
      path: MediCabinet/Info.plist
      properties:
        CFBundleDisplayName: MediCabinet
        CFBundleDevelopmentRegion: fr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.medicabinet.app
        PRODUCT_NAME: MediCabinet
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: "0.1.1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: MediCabinet/Info.plist
    scheme:
      testTargets:
        - MediCabinetTests
        - MediCabinetUITests
      gatherCoverageData: true
      coverageTargets:
        - MediCabinet
  MediCabinetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MediCabinetTests
    dependencies:
      - target: MediCabinet
      - package: MediCabinetCore
      - package: MediCabinetCore
        product: MediCabinetCoreTestSupport
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.medicabinet.app.tests
        GENERATE_INFOPLIST_FILE: YES
  MediCabinetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MediCabinetUITests
    dependencies:
      - target: MediCabinet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.medicabinet.app.uitests
        GENERATE_INFOPLIST_FILE: YES
